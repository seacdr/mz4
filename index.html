<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四大名著 · 精读总目录</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f7f5f0; color: #2d3748; }
        h1,h2,h3,.serif { font-family: 'Noto Serif SC', serif; }
        .card {
            display: flex; align-items: center; gap: 20px;
            background: #fff; border: 1px solid #ece7dc; border-radius: 14px;
            padding: 22px 26px; cursor: pointer;
            transition: all .2s ease;
        }
        .card:hover { border-color: #d3c5a3; box-shadow: 0 6px 18px -6px rgba(0,0,0,.12); transform: translateY(-1px); }
        .card.read { background: #ece9e3; border-color: #ddd8ce; opacity: .72; }
        .card.read .num { background: #b5b1a7; }
        .card.read .title { color: #8a857b; }
        .card.read .arrow { color: #c4bfb5; }
        .num {
            flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
            background: #92400e; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 700; font-family: 'Noto Serif SC', serif;
        }
        .body { flex: 1; min-width: 0; }
        .title { font-size: 19px; font-weight: 700; color: #1f2937; }
        .meta { font-size: 12px; color: #a16207; font-family: 'Noto Serif SC', serif; margin: 4px 0 8px; }
        .desc { font-size: 13.5px; color: #6b7280; line-height: 1.7; margin-bottom: 10px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { font-size: 11px; background: #f6edda; color: #8a5a1f; border: 1px solid #e9dcc0; padding: 2px 10px; border-radius: 999px; }
        .link {
            flex-shrink: 0; margin-left: 8px;
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 13px; color: #92400e; background: #f6edda;
            border: 1px solid #e3d3ac; padding: 8px 16px; border-radius: 999px;
            white-space: nowrap; transition: all .2s ease;
        }
        .card:hover .link { background: #92400e; color: #fff; border-color: #92400e; }
        .card.read .link { background: #d6d1c6; color: #8a857b; border-color: #d6d1c6; }
        .arrow { font-size: 26px; color: #cfc0a0; margin-left: 6px; flex-shrink: 0; }
        .bar { height: 7px; background: #e9e4d9; border-radius: 999px; overflow: hidden; }
        .fill { height: 100%; background: linear-gradient(90deg,#a16207,#92400e); transition: width .4s; }
        .stat-btn { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid #d8d2c5; background: #fff; color: #6b7280; cursor: pointer; }
        .stat-btn.on { background: #92400e; color: #fff; border-color: #92400e; }
        .hint { font-size: 12px; color: #9ca3af; text-align: center; }
        .intro {
            background: #fff; border: 1px solid #ece7dc; border-radius: 14px;
            padding: 20px 26px; margin-bottom: 6px;
        }
        .intro p { font-size: 14px; color: #4b5563; line-height: 1.9; }
        .intro strong { color: #92400e; }
        /* ===== 一键返回顶部 ===== */
        #back-to-top {
            position: fixed; right: 28px; bottom: 44px;
            width: 52px; height: 52px; border-radius: 50%;
            background: #92400e; color: #fff; font-size: 24px;
            line-height: 50px; text-align: center; cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
            display: block; text-decoration: none; z-index: 9999;
            opacity: 0; visibility: hidden; transform: translateY(10px);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
        }
        #back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #back-to-top:hover { background: #78350f; }
    </style>
</head>
<body class="antialiased">
    <!-- 顶部锚点：返回顶部按钮的原生跳转目标 -->
    <div id="top"></div>
    <header class="py-8 border-b border-[#ece6da] bg-white">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-3xl font-bold text-gray-900 text-center">四大名著</h1>
            <p class="text-center text-gray-500 serif text-sm mt-2">中国古典小说的四座高峰 · 一页览尽</p>
            <p><strong>四大名著</strong>，指《三国演义》《水浒传》《西游记》《红楼梦》四部中国古典长篇小说，是中华文学史上公认的最高成就。它们跨越元、明、清三代，囊括历史演义、英雄传奇、神魔幻想、世情悲剧四种气象，各有其「趣」，亦各有其「道」：读三国见智谋，读水浒见义气，读西游见修心，读红楼见人情。</p>
            <div class="max-w-sm mx-auto mt-5">
                <div class="flex justify-between text-xs text-gray-500 mb-1">
                    <span id="stat">已探索 0 / 4</span><span id="pct">0%</span>
                </div>
                <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
            </div>
            <div class="flex justify-center gap-2 mt-4">
                <button class="stat-btn on" data-f="all">全部</button>
                <button class="stat-btn" data-f="unread">未读</button>
                <button class="stat-btn" data-f="read">已读</button>
                <button class="stat-btn" id="toggleAll">一键标记 / 清除</button>
            </div>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-6">
        <div id="list" class="space-y-4"></div>
        <p class="hint mt-6">点击卡片进入精读 · 已探索进度自动保存 · 已探索的作品再次点击直接进入</p>
    </main>
    <!-- 一键返回顶部 -->
    <a href="#top" id="back-to-top" aria-label="返回顶部" title="返回顶部">↑</a>
    <script>
    /** 四大名著数据（链接可替换为你自己建好的本地精读页） */
    const DATA = [
        {
            "n": "壹", "k": "sanguo",
            "t": "三国演义",
            "meta": "罗贯中 · 元末明初 · 历史演义开山之作",
            "f": "https://baike.baidu.com/item/%E4%B8%89%E5%9B%BD%E6%BC%94%E4%B9%89",
            "d": "中国第一部长篇章回体历史演义小说。以东汉末年至西晋统一近百年的历史风云为背景，铺陈魏、蜀、吴三国的兴衰。曹操之奸、关羽之忠、孔明之智、子龙之勇……人物鲜活如画，权谋机变、尔虞我诈尽在其中。「天下大势，分久必合，合久必分。」",
            "tags": ["历史演义", "忠义", "谋略", "群雄逐鹿"]
        },
        {
            "n": "贰", "k": "shuihu",
            "t": "水浒传",
            "meta": "施耐庵 · 元末明初 · 白话章回体先驱",
            "f": "https://baike.baidu.com/item/%E6%B0%B4%E6%B5%92%E4%BC%A0",
            "d": "中国历史上第一部用白话文写成的章回体长篇小说。讲述北宋末年，以宋江为首的一百单八将「官逼民反」，聚义梁山泊，劫富济贫、替天行道，终受招安、远征方腊。鲁智深之豪、武松之勇、李逵之憨……一百零八条好汉，一百零八种活法。",
            "tags": ["官逼民反", "梁山好汉", "侠义", "108将"]
        },
        {
            "n": "叁", "k": "xiyouji",
            "t": "西游记",
            "meta": "吴承恩 · 明代 · 神魔小说巅峰之作",
            "f": "./西游记/index.html",
            "d": "中国神魔小说的巅峰之作。唐僧师徒四人西行十万八千里，历经九九八十一难，降妖除魔、明心见性。孙悟空的「定心」之路，正是每个人与自身欲望、执念、懒惰搏斗的寓言。本书已精读 46 回目、1476 道题，点击即可进入。",
            "tags": ["神魔小说", "心性修持", "九九八十一难", "师徒情谊"]
        },
        {
            "n": "肆", "k": "hongloumeng",
            "t": "红楼梦",
            "meta": "曹雪芹 · 清代 · 古典小说集大成者",
            "f": "https://baike.baidu.com/item/%E7%BA%A2%E6%A5%BC%E6%A2%A6",
            "d": "中国古典小说的巅峰之作，被公认为四大名著之首。以贾宝玉与林黛玉、薛宝钗的爱情婚姻悲剧为主线，铺开贾府由盛转衰的家族史诗。「满纸荒唐言，一把辛酸泪」，一部封建社会的百科全书，写尽人情冷暖与盛衰无常。",
            "tags": ["爱情悲剧", "家族兴衰", "人情世态", "百科全书"]
        }
    ];
    const KEY = 'xyj_visited_novels';
    const $ = id => document.getElementById(id);
    const readSet = () => { try { const r = localStorage.getItem(KEY); return r ? new Set(JSON.parse(r)) : new Set(); } catch(e){ return new Set(); } };
    const save = s => localStorage.setItem(KEY, JSON.stringify([...s]));
    let filter = 'all';
    const list = $('list');
    /** 渲染卡片（序号 + 书名 + 作者时代 + 简介 + 标签 + 进入链接） */
    function render() {
        const read = readSet();
        list.innerHTML = DATA.map(it => `
            <div class="card" data-k="${it.k}">
                <div class="num">${it.n}</div>
                <div class="body">
                    <div class="title">${it.t}</div>
                    <div class="meta">${it.meta}</div>
                    <div class="desc">${it.d}</div>
                    <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
                </div>
                <span class="link">${read.has(it.k) ? '已探索 · 进入' : '进入精读'} ›</span>
            </div>`).join('');
        document.querySelectorAll('.card').forEach(c => {
            if (read.has(c.dataset.k)) c.classList.add('read');
        });
        applyFilter();
        updateStat();
        bind();
    }
    function bind() {
        document.querySelectorAll('.card').forEach(c => {
            c.onclick = () => {
                const k = c.dataset.k;
                const it = DATA.find(x => x.k === k);
                const s = readSet();
                // 已探索的作品：点击直接进入，不改变状态
                if (!s.has(k)) { s.add(k); save(s); updateStat(); }
                c.classList.add('read');
                window.location.href = it.f;
            };
        });
    }
    function applyFilter() {
        const read = readSet();
        document.querySelectorAll('.card').forEach(c => {
            const isRead = read.has(c.dataset.k);
            c.style.display = (filter==='all' || (filter==='read'&&isRead) || (filter==='unread'&&!isRead)) ? '' : 'none';
        });
    }
    function updateStat() {
        const read = readSet();
        const n = DATA.filter(it => read.has(it.k)).length;
        const p = Math.round(n / DATA.length * 100);
        $('stat').textContent = `已探索 ${n} / ${DATA.length}`;
        $('pct').textContent = p + '%';
        $('fill').style.width = p + '%';
    }
    document.querySelectorAll('.stat-btn').forEach(b => {
        b.onclick = () => {
            if (b.id === 'toggleAll') {
                const cards = document.querySelectorAll('.card');
                const allRead = [...cards].every(c=>c.classList.contains('read'));
                cards.forEach(c => allRead ? c.classList.remove('read') : c.classList.add('read'));
                const s = new Set();
                if (!allRead) cards.forEach(c=>s.add(c.dataset.k));
                save(s); updateStat(); return;
            }
            filter = b.dataset.f;
            document.querySelectorAll('.stat-btn').forEach(x=>x.classList.remove('on'));
            b.classList.add('on');
            applyFilter();
        };
    });
    document.addEventListener('DOMContentLoaded', render);

    /* ===== 一键返回顶部 ===== */
    (function () {
        const btn = document.getElementById('back-to-top');
        if (!btn) return;
        const yNow = () => window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        const showBtn = () => btn.classList.toggle('show', yNow() > 300);
        window.addEventListener('scroll', showBtn, { passive: true });
        document.addEventListener('scroll', showBtn, { passive: true });
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            if (window.scrollTo) { try { window.scrollTo(0, 0); } catch (err) {} }
        });
        showBtn();
    })();
    </script>
</body>
</html>
