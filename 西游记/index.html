<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《西游记》精读总目录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f7f5f0; color: #2d3748; }
        h1,h2,h3,.serif { font-family: 'Noto Serif SC', serif; }
        .card {
            display: flex; align-items: center; gap: 20px;
            background: #fff; border: 1px solid #ece7dc; border-radius: 12px;
            padding: 18px 22px; cursor: pointer;
            transition: all .2s ease;
        }
        .card:hover { border-color: #d3c5a3; box-shadow: 0 4px 14px -4px rgba(0,0,0,.1); }
        .card.read { background: #ece9e3; border-color: #ddd8ce; opacity: .7; }
        .card.read .num { background: #b5b1a7; }
        .card.read .title { color: #8a857b; }
        .card.read .arrow { color: #c4bfb5; }
        .num {
            flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%;
            background: #92400e; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700; font-family: 'Noto Serif SC', serif;
        }
        .body { flex: 1; min-width: 0; }
        .title { font-size: 17px; font-weight: 700; color: #1f2937; margin-bottom: 5px; }
        .desc { font-size: 13px; color: #6b7280; line-height: 1.65; margin-bottom: 8px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { font-size: 11px; background: #f6edda; color: #8a5a1f; border: 1px solid #e9dcc0; padding: 2px 10px; border-radius: 999px; }
        .arrow { font-size: 26px; color: #cfc0a0; margin-left: 6px; flex-shrink: 0; }
        .bar { height: 7px; background: #e9e4d9; border-radius: 999px; overflow: hidden; }
        .fill { height: 100%; background: linear-gradient(90deg,#a16207,#92400e); transition: width .4s; }
        .stat-btn { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid #d8d2c5; background: #fff; color: #6b7280; cursor: pointer; }
        .stat-btn.on { background: #92400e; color: #fff; border-color: #92400e; }
        .hint { font-size: 12px; color: #9ca3af; text-align: center; }
        
        /* 回到顶部按钮样式 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #92400e;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, background 0.2s ease;
            z-index: 50;
        }
        .back-to-top:hover {
            background: #78350f;
        }
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="antialiased">
    <header class="py-8 border-b border-[#ece6da] bg-white">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-2xl font-bold text-gray-900 text-center">《西游记》精读总目录</h1>
            <p class="text-center text-gray-500 serif text-sm mt-1">已收录回目 · 001 — 130</p>
            <div class="max-w-sm mx-auto mt-4">
                <div class="flex justify-between text-xs text-gray-500 mb-1">
                    <span id="stat">已读 0 / 94</span><span id="pct">0%</span>
                </div>
                <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
            </div>
            <div class="flex justify-center gap-2 mt-4">
                <button class="stat-btn on" data-f="all">全部</button>
                <button class="stat-btn" data-f="unread">未读</button>
                <button class="stat-btn" data-f="read">已读</button>
                <button class="stat-btn" id="toggleAll">一键标记 / 清除</button>
            </div>
        </div>
    </header>
    <main class="max-w-3xl mx-auto px-4 py-6">
        <div id="list" class="space-y-3"></div>
        <p class="hint mt-6">点击卡片自动标记「已读」并进入对应回目页 · 进度自动保存</p>
    </main>

    <div id="backToTop" class="back-to-top" title="回到顶部">↑</div>

    <script>
    const KEY = 'xyj_read_chapters';
    const $ = id => document.getElementById(id);
    const readSet = () => { try { const r = localStorage.getItem(KEY); return r ? new Set(JSON.parse(r)) : new Set(); } catch(e){ return new Set(); } };
    const save = s => localStorage.setItem(KEY, JSON.stringify([...s]));

    let filter = 'all';
    const list = $('list');

    /** 用 JSON 数据渲染卡片（序号圆 + 标题 + 简介 + 标签 + 箭头） */
    function render() {
        const read = readSet();
        list.innerHTML = DATA.map(it => `
            <div class="card" data-n="${it.n}" data-f="${it.f}">
                <div class="num">${it.n}</div>
                <div class="body">
                    <div class="title">${it.t}</div>
                    <div class="desc">${it.d}</div>
                    <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
                </div>
                <div class="arrow">›</div>
            </div>`).join('');
        document.querySelectorAll('.card').forEach(c => {
            if (read.has(c.dataset.n)) c.classList.add('read');
        });
        applyFilter();
        updateStat();
        bind();
    }

    function bind() {
        document.querySelectorAll('.card').forEach(c => {
            c.onclick = () => {
                const n = c.dataset.n;
                const s = readSet();
                // 如果未读，则标记为已读；如果已经是已读，则不做修改直接跳转
                if (!s.has(n)) {
                    s.add(n);
                    c.classList.add('read');
                    save(s);
                    updateStat();
                }
                // 点击后进入对应回目页
                window.location.href = c.dataset.f;
            };
        });
    }

    function applyFilter() {
        const read = readSet();
        document.querySelectorAll('.card').forEach(c => {
            const isRead = read.has(c.dataset.n);
            c.style.display = (filter==='all' || (filter==='read'&&isRead) || (filter==='unread'&&!isRead)) ? '' : 'none';
        });
    }

    function updateStat() {
        const read = readSet();
        const n = DATA.filter(it=>read.has(it.n)).length;
        const p = Math.round(n/DATA.length*100);
        $('stat').textContent = `已读 ${n} / ${DATA.length}`;
        $('pct').textContent = p + '%';
        $('fill').style.width = p + '%';
    }

    document.querySelectorAll('.stat-btn').forEach(b => {
        b.onclick = () => {
            if (b.id === 'toggleAll') {
                const cards = document.querySelectorAll('.card');
                const allRead = [...cards].every(c=>c.classList.contains('read'));
                cards.forEach(c => allRead ? c.classList.remove('read') : c.classList.add('read'));
                const s = new Set();
                if (!allRead) cards.forEach(c=>s.add(c.dataset.n));
                save(s); updateStat(); return;
            }
            filter = b.dataset.f;
            document.querySelectorAll('.stat-btn').forEach(x=>x.classList.remove('on'));
            b.classList.add('on');
            applyFilter();
        };
    });

    // 控制回到顶部按钮的显隐与点击事件
    const backToTopBtn = $('backToTop');
    window.onscroll = () => {
        if (document.body.scrollTop > 150 || document.documentElement.scrollTop > 150) {
            backToTopBtn.classList.add('show');
        } else {
            backToTopBtn.classList.remove('show');
        }
    };
    backToTopBtn.onclick = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.addEventListener('DOMContentLoaded', render);
    </script>
    
    <!-- JavaScript Application Logic -->
    <script src="./js/huimu.js"></script>
</body>
</html>
